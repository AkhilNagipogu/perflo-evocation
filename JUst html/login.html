<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in — Prflo</title><link rel="stylesheet" href="style.css"></head>
<body class="min-h-screen bg-slate-50 px-4 py-12 md:px-8">
  <div class="mx-auto max-w-6xl overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-xl">
    <div class="grid md:grid-cols-2">
      <aside class="hidden bg-slate-900 p-10 text-white md:flex md:flex-col md:justify-between">
        <div><a href="index.html" class="mb-8 flex items-center gap-3"><span class="flex h-12 w-12 items-center justify-center rounded-2xl bg-indigo-500 font-bold">P</span><span><strong class="block text-2xl">Prflo</strong><small class="text-xs uppercase tracking-widest text-slate-300">by Evocation</small></span></a><h1 class="text-4xl font-black tracking-tight">Welcome back to your control panel.</h1></div>
        <div class="rounded-2xl border border-slate-700 bg-slate-800 p-5"><p class="text-xs uppercase tracking-widest text-slate-400">Demo credentials</p><div class="mt-3 space-y-2 text-sm text-slate-200"><p>Email: demo@prflo.dev</p><p>Password: demo123</p></div></div>
      </aside>
      <main class="p-6 sm:p-10">
        <div class="mb-8 flex items-start justify-between"><div><p class="text-sm font-semibold uppercase tracking-widest text-indigo-600">Sign in</p><h2 class="mt-2 text-3xl font-bold text-slate-900">Access your dashboard</h2></div><a href="index.html" class="text-sm text-slate-500">Home</a></div>
        <form class="space-y-5" action="overview.html">
          <label class="block text-sm font-medium text-slate-700">Email<input class="mt-2 block w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3" type="email" placeholder="demo@prflo.dev"></label>
          <label class="block text-sm font-medium text-slate-700">Password<input class="mt-2 block w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3" type="password" placeholder="Enter your password"></label>
          <div class="flex items-center justify-between text-sm text-slate-600"><label><input type="checkbox"> Remember me</label><a href="#" class="font-medium text-indigo-600">Forgot password?</a></div>
          <a href="overview.html" class="block w-full rounded-xl bg-indigo-600 px-4 py-3 text-center font-semibold text-white">Sign in</a>
        </form>
        <p class="mt-6 text-center text-sm text-slate-600">New to Prflo? <a href="register.html" class="font-semibold text-indigo-600">Create an account</a></p>
      </main>
    </div>
  </div>
</body></html>
