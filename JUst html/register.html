<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account — Prflo</title><link rel="stylesheet" href="style.css"></head>
<body class="min-h-screen bg-slate-50 px-4 py-12 md:px-8">
  <div class="mx-auto max-w-6xl overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-xl">
    <div class="grid md:grid-cols-2">
      <aside class="hidden bg-slate-900 p-10 text-white md:flex md:flex-col md:justify-between">
        <div><a href="index.html" class="mb-8 flex items-center gap-3"><span class="flex h-12 w-12 items-center justify-center rounded-2xl bg-indigo-500 font-bold">P</span><span><strong class="block text-2xl">Prflo</strong><small class="text-xs uppercase tracking-widest text-slate-300">by Evocation</small></span></a><h1 class="text-4xl font-black tracking-tight">Claim a space for your next big idea.</h1></div>
        <div class="rounded-2xl border border-slate-700 bg-slate-800 p-5 text-sm text-slate-200"><p class="text-xs uppercase tracking-widest text-slate-400">Demo account</p><p class="mt-3">Explore subdomains, DNS management, and wallet credits in a simulated environment.</p></div>
      </aside>
      <main class="p-6 sm:p-10">
        <div class="mb-8 flex items-start justify-between"><div><p class="text-sm font-semibold uppercase tracking-widest text-indigo-600">Create account</p><h2 class="mt-2 text-3xl font-bold text-slate-900">Start your own subdomain</h2></div><a href="index.html" class="text-sm text-slate-500">Home</a></div>
        <form class="space-y-4" action="overview.html">
          <label class="block text-sm font-medium text-slate-700">Full name<input class="mt-2 block w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3" placeholder="Full name"></label>
          <label class="block text-sm font-medium text-slate-700">Username<input class="mt-2 block w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3" placeholder="Username"></label>
          <label class="block text-sm font-medium text-slate-700">Email<input class="mt-2 block w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3" type="email" placeholder="Email"></label>
          <label class="block text-sm font-medium text-slate-700">Password<input class="mt-2 block w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3" type="password" placeholder="Enter your password"></label>
          <label class="block text-sm font-medium text-slate-700">Confirm password<input class="mt-2 block w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3" type="password" placeholder="Confirm your password"></label>
          <label class="flex items-start gap-2 text-sm text-slate-600"><input class="mt-1" type="checkbox"> I agree to the demo terms and understand that this is a simulated environment.</label>
          <a href="overview.html" class="block rounded-xl bg-indigo-600 px-4 py-3 text-center font-semibold text-white">Create account</a>
        </form>
        <p class="mt-6 text-center text-sm text-slate-600">Already have an account? <a href="login.html" class="font-semibold text-indigo-600">Sign in</a></p>
      </main>
    </div>
  </div>
</body></html>
